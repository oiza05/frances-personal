<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Francés personal · v1.3</title>
</head>
<body>
<header class="topbar">
  <div>
    <h1 id="appTitle">🇫🇷 Francés personal</h1>
    <div id="appSubtitle" class="muted small">Tu biblioteca y práctica de francés</div>
  </div>
  <div class="topbar-actions">
    <label class="language-picker">
      <span class="muted small">Idioma</span>
      <select id="languageSelect" onchange="switchLanguage(this.value)" aria-label="Seleccionar idioma">
        <option value="fr">🇫🇷 Francés</option>
        <option value="zh">🇨🇳 Chino</option>
      </select>
    </label>
    <button class="icon-btn" onclick="goHome()" title="Inicio">⌂</button>
  </div>
</header>

<nav class="nav">
  <button class="navbtn active" id="navHome" onclick="goHome()">🏠 Niveles</button>
  <button class="navbtn" id="navStatistics" onclick="statistics()">📊 Estadísticas</button>
  <button class="navbtn" id="navLibrary" onclick="library()">📚 Biblioteca</button>
  <button class="navbtn" id="navSync" onclick="openSync()">☁️ Sincronizar</button>
</nav>

<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js?v=2.0"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
